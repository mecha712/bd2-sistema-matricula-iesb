# =====================================================================
# Projeto Academico - Banco de Dados II (CCO072) - IESB 2026/2
#
# Subir:            docker compose up -d --build --wait
# Desligar:         docker compose down        (os dados FICAM guardados)
# Recriar do zero:  docker compose down -v     (APAGA o banco) e subir de novo
#
# Conexao: porta 5434 / banco iesb / usuario postgres / senha iesb2026
#   pgAdmin aplicativo (instalado no Windows): host localhost
#   pgAdmin no navegador (roda em Docker):     host host.docker.internal
#
# Porta 5434 de proposito: nao briga com o bd1_postgres (5433) nem com um
# PostgreSQL instalado no computador (5432). Se estiver ocupada, troque o
# primeiro numero abaixo (ex.: "5435:5432") e use a nova porta no pgAdmin.
# =====================================================================
name: bd2_projeto

services:
  db:
    build: .
    image: bd2_projeto_db:17
    container_name: bd2_projeto_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: iesb2026
      POSTGRES_DB: iesb
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - dados_bd2:/var/lib/postgresql/data
    # "pronto" = aceitando conexao TCP. Durante a criacao do banco (scripts
    # 01 a 09) o PostgreSQL so escuta por socket local, entao o healthcheck
    # so passa depois que TODOS os scripts terminaram.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d iesb"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 600s

volumes:
  dados_bd2:
